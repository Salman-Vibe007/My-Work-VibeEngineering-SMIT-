[project]
name = "finally-backend"
version = "0.1.0"
description = "FinAlly - AI Trading Workstation backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "litellm>=1.50",
    "python-dotenv>=1.0",
    "psycopg[binary,pool]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]
pgtest = ["pgserver>=0.1.4"]        # optional: lets the tests run against a real local PostgreSQL

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
