services:
  app:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ../../apps/web/public:/app/apps/web/public:ro

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prelegal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../packages/database/prisma/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prelegal"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  # Optional: Run migrations on startup
  migrate:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: prisma-generate
    command: pnpm db:migrate --filter=@prelegal/database
    env_file:
      - ../../.env
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migrate

  # Optional: Seed database
  seed:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
      target: prisma-generate
    command: pnpm db:seed --filter=@prelegal/database
    env_file:
      - ../../.env
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - seed

volumes:
  postgres_data:
  redis_data: